<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Listings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Real Estate Listings</h1>

    <h2>Add a New House</h2>
    <form id="add-house-form">
        <input type="text" id="price" placeholder="Price" required>
        <input type="number" id="sqrft" placeholder="Square Feet" required>
        <input type="number" id="beds" placeholder="Beds" required>
        <input type="number" id="baths" placeholder="Baths">
        <input type="text" id="type" placeholder="Type">
        <input type="text" id="location" placeholder="Location">
        <input type="date" id="dateListed" placeholder="Date Listed">
        <input type="text" id="status" placeholder="Status">
        <input type="number" id="interestedPpl" placeholder="Interested People">
        <button type="submit">Add House</button>
    </form>

    <h2>Update a House</h2>
    <form id="update-house-form">
        <input type="number" id="update-id" placeholder="House ID" required>
        <input type="text" id="update-price" placeholder="Price">
        <input type="number" id="update-sqrft" placeholder="Square Feet">
        <input type="number" id="update-beds" placeholder="Beds">
        <input type="number" id="update-baths" placeholder="Baths">
        <input type="text" id="update-type" placeholder="Type">
        <input type="text" id="update-location" placeholder="Location">
        <input type="date" id="update-dateListed" placeholder="Date Listed">
        <input type="text" id="update-status" placeholder="Status">
        <input type="number" id="update-interestedPpl" placeholder="Interested People">
        <button type="submit">Update House</button>
    </form>

    <h2>House Listings</h2>
    <table id="houses-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Price</th>
                <th>Square Feet</th>
                <th>Beds</th>
                <th>Baths</th>
                <th>Type</th>
                <th>Location</th>
                <th>Date Listed</th>
                <th>Status</th>
                <th>Interested People</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will be inserted here by JavaScript -->
        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
